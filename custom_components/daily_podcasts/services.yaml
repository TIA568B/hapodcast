build_queue:
  name: Build and play today's podcast queue
  description: >
    Fetch each configured podcast feed and include every episode published
    since that podcast was last prepared (per-podcast catch-up; podcasts with
    catch-up off use today only), in listening order, record the playlist to
    history, and (by default) play it on the configured player. Pass play=false
    to only prepare/record the playlist without playing.
  fields:
    player:
      name: Player
      description: Sonos / media_player to queue onto. Defaults to the configured player.
      required: false
      example: media_player.office
      selector:
        entity:
          domain: media_player
    play:
      name: Play now
      description: Play the queue immediately. Turn off to only prepare/record today's playlist.
      required: false
      default: true
      selector:
        boolean:
    prefer_prepared:
      name: Prefer prepared playlist
      description: >
        Instant play: if today's playlist was already prepared (by the daily or
        intraday run), play it straight away without fetching feeds (avoids the
        feed-fetch delay). Only builds from feeds if nothing is prepared yet.
        Ignored unless play is on.
      required: false
      default: false
      selector:
        boolean:
    tz:
      name: Timezone
      description: IANA timezone name used to decide "today". Defaults to HA's local timezone.
      required: false
      example: America/New_York
      selector:
        text:
    dry_run:
      name: Dry run
      description: Log the plan without touching the player or writing history.
      required: false
      default: false
      selector:
        boolean:

play_history:
  name: Play recorded podcast history
  description: >
    Replay one or more previously recorded daily playlists (catch-up). Days play
    in chronological order, preserving each day's internal podcast order.
    Selector precedence: date, then start/end, then since, then days, then all.
  fields:
    player:
      name: Player
      description: Music Assistant / Sonos media_player to queue onto. Defaults to the configured player.
      required: false
      example: media_player.sonos_kitchen
      selector:
        entity:
          domain: media_player
    date:
      name: Single date
      description: Replay just this one recorded day (YYYY-MM-DD).
      required: false
      example: "2026-09-22"
      selector:
        text:
    start:
      name: Range start
      description: Inclusive start of a date range (YYYY-MM-DD). Either side optional.
      required: false
      example: "2026-09-20"
      selector:
        text:
    end:
      name: Range end
      description: Inclusive end of a date range (YYYY-MM-DD). Either side optional.
      required: false
      example: "2026-09-24"
      selector:
        text:
    since:
      name: Since date
      description: Replay everything recorded from this date through today (YYYY-MM-DD).
      required: false
      example: "2026-09-20"
      selector:
        text:
    days:
      name: Last N days
      description: Replay the last N recorded days.
      required: false
      example: 5
      selector:
        number:
          min: 1
          max: 60
          mode: box
    dry_run:
      name: Dry run
      description: Log what would play without touching the player.
      required: false
      default: false
      selector:
        boolean:

get_queue:
  name: Get the current queue
  description: >
    Return the player's now-playing info and live queue, with each item mapped
    back to its podcast name/title from recent history, plus the next scheduled
    prepare time. Used by the Daily Podcasts panel Overview tab; returns a
    response (no side effects).
  fields:
    player:
      name: Player
      description: media_player to inspect. Defaults to the configured player.
      required: false
      example: media_player.office
      selector:
        entity:
          domain: media_player

skip_to:
  name: Skip to a queue position
  description: >
    Jump playback to a 0-based position in the current queue. Requires the
    Sonos integration (uses sonos.play_queue).
  fields:
    player:
      name: Player
      description: media_player to control. Defaults to the configured player.
      required: false
      example: media_player.office
      selector:
        entity:
          domain: media_player
    position:
      name: Queue position
      description: 0-based index of the queue item to play (the first item is 0).
      required: true
      example: 2
      selector:
        number:
          min: 0
          max: 500
          mode: box

remove_from_queue:
  name: Remove an item from the queue
  description: >
    Remove a single item at a 0-based position from the current queue. Requires
    the Sonos integration (uses sonos.remove_from_queue).
  fields:
    player:
      name: Player
      description: media_player to control. Defaults to the configured player.
      required: false
      example: media_player.office
      selector:
        entity:
          domain: media_player
    position:
      name: Queue position
      description: 0-based index of the queue item to remove (the first item is 0).
      required: true
      example: 2
      selector:
        number:
          min: 0
          max: 500
          mode: box

list_podcasts:
  name: List podcasts
  description: >
    Return the current ordered podcast list and configured player. Used by the
    Daily Podcasts sidebar panel; returns a response (no side effects).

set_podcasts:
  name: Set podcasts
  description: >
    Replace the entire ordered podcast list (add / remove / edit / reorder in
    one call). Used by the Daily Podcasts sidebar panel. Entries without a
    name or a valid feed URL are skipped.
  fields:
    podcasts:
      name: Podcasts
      description: >
        The full ordered list of podcasts. Each item has name, feed_url and
        catchup (boolean).
      required: true
      example: >
        [{"name": "Up First", "feed_url": "https://feeds.npr.org/510318/podcast.xml", "catchup": true}]
      selector:
        object:
