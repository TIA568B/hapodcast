# ---------------------------------------------------------------------------
# pyscript configuration
# ---------------------------------------------------------------------------
#
# Wire this file into Home Assistant with a single line in configuration.yaml:
#
#     pyscript: !include pyscript/config.yaml
#
# Editing this file auto-reloads pyscript (no HA restart needed), so changing
# the podcast list below takes effect on the next automation run.
#
# `allow_all_imports` lets the app import feedparser/urllib/zoneinfo.
# `hass_is_global` exposes `hass` so we can read Home Assistant's local
# timezone (hass.config.time_zone). Both are required by this app.
# ---------------------------------------------------------------------------

allow_all_imports: true
hass_is_global: true

apps:
  # The app only loads because this config entry exists. Everything under
  # `daily_podcasts:` is injected into the app as `pyscript.app_config`.
  daily_podcasts:
    # -- The Sonos / Music Assistant player to queue onto. -------------------
    player: media_player.sonos_kitchen

    # -- Optional settings (safe to leave as-is). ----------------------------
    # timezone: "America/New_York"   # override HA local tz if you must
    # fetch_timeout: 20              # per-feed HTTP timeout, seconds
    # dry_run: false                 # true = log the plan, don't touch Sonos
    #
    # History / catch-up:
    # Every daily run records the playlist it built to a per-day JSON file so
    # you can replay past days later (e.g. catch up after a holiday). This
    # happens automatically -- the automation runs every morning whether you're
    # home or away.
    # history_dir: pyscript/podcast_history   # relative to your HA config dir
    # record_only: false            # true = record daily playlists but never
    #                               #        auto-play; you play them on demand
    #                               #        via pyscript.play_podcast_history

    # -- THE PODCAST LIST ----------------------------------------------------
    # This is the ONE place to edit. List podcasts in the exact order you
    # want to hear them. To add/remove/reorder a podcast, edit this list only
    # -- no code changes anywhere else. Each entry needs a `name` (for logs)
    # and a `feed_url` (the podcast's RSS feed).
    podcasts:
      - name: The Daily
        feed_url: https://feeds.simplecast.com/54nAGcIl

      - name: Up First
        feed_url: https://feeds.npr.org/510318/podcast.xml

      - name: Marketplace
        feed_url: https://www.marketplace.org/feed/podcast/marketplace

      - name: BBC Global News
        feed_url: https://podcasts.files.bbci.co.uk/p02nq0gn.rss

      - name: Science Friday
        feed_url: https://feeds.simplecast.com/wjQvYtdl
