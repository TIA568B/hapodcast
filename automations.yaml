# ===========================================================================
# OPTIONAL — you do NOT need this file for a normal install.
# ===========================================================================
# The daily build runs on the integration's OWN schedule (set the time in the
# UI: Configure -> Settings). No automation is required for daily playback.
#
# This file is only a ready-to-adapt example for a one-tap "catch-up since I
# last listened" button. To use it:
#   1. Create an input_datetime helper (Settings -> Devices & services ->
#      Helpers -> Create helper -> Date and/or time), e.g.
#      input_datetime.podcasts_last_played.
#   2. Add the automation below to your automations (via the UI, or by copying
#      the list item into your existing automations.yaml).
#   3. Trigger it from a dashboard button, NFC tag, or voice.
# ---------------------------------------------------------------------------

# - id: podcast_catch_up_since_helper
#   alias: Podcast Catch-up (since helper date)
#   trigger: []            # triggered manually, or wire to a button/NFC tag
#   action:
#     - service: daily_podcasts.play_history
#       data:
#         since: "{{ states('input_datetime.podcasts_last_played') | as_datetime | as_local | strftime('%Y-%m-%d') }}"
